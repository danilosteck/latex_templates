[project]
name = "study-with-ai"
version = "0.1.0"
description = "App local de estudo: gera quizzes de multipla escolha a partir de PDFs de filosofia"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "google-genai>=1.0",
    "openai>=1.50",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "altair>=5.4",
]

[tool.uv]
package = false
